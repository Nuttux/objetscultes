<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJCLT101 — Objets Cultes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PAGE 1: Exhibition Hall -->
  <section id="exhibition" class="page">
    <object data="svg/page-1.svg" type="image/svg+xml" class="page-svg"></object>
    <div class="nav-overlay">
      <a href="#library" class="nav-link nav-fouiller">Fouiller à la bibliothèque</a>
      <a href="#library" class="nav-link nav-decouvrir">Découvrir la salle suivante</a>
    </div>
  </section>

  <!-- PAGE 2: Library -->
  <section id="library" class="page">
    <object data="svg/page-2.svg" type="image/svg+xml" class="page-svg"></object>
    <div class="nav-overlay">
      <a href="#exhibition" class="nav-link nav-retourner">Retourner à la salle d'exposition</a>
      <span class="nav-link nav-precedente nav-disabled">Page précédente</span>
      <a href="#collection" class="nav-link nav-suivante">Page suivante</a>
    </div>
  </section>

  <!-- PAGE 3: Collection -->
  <section id="collection" class="page">
    <object data="svg/page-3.svg" type="image/svg+xml" class="page-svg"></object>
    <div class="nav-overlay">
      <a href="#exhibition" class="nav-link nav-retourner">Retourner à la salle d'exposition</a>
      <a href="#library" class="nav-link nav-precedente">Page précédente</a>
      <a href="#detail" class="nav-link nav-suivante">Page suivante</a>
    </div>
  </section>

  <!-- PAGE 4: Detail -->
  <section id="detail" class="page">
    <object data="svg/page-4.svg" type="image/svg+xml" class="page-svg"></object>
    <div class="nav-overlay">
      <a href="#exhibition" class="nav-link nav-retourner">Retourner à la salle d'exposition</a>
      <a href="#collection" class="nav-link nav-precedente">Page précédente</a>
      <a href="#exhibition" class="nav-link nav-suivante">Page suivante</a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
